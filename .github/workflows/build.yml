name: Build Purrfect Stealth
on:
  workflow_dispatch:

env:
  JAVA_HOME: /usr/lib/jvm/temurin-21-amd64
  ANDROID_HOME: /home/runner/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install system deps
        run: sudo apt-get install -y unzip wget

      - name: Accept SDK licenses manually
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/ct_raw
          mv /tmp/ct_raw/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" \
            "ndk;28.2.13676358" \
            --sdk_root=$ANDROID_HOME

      - name: Run stealth build
        run: bash purrfect-stealth-build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: purrfect-stealth-apk
          path: ~/Purrfect-stealth-*-debug.apk
          retention-days: 7
          if-no-files-found: error
