name: Build Purrfect Stealth
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install system deps
        run: sudo apt-get install -y unzip wget

      - name: Run stealth build
        run: bash purrfect-stealth-build.sh
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-21-amd64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: purrfect-stealth-apk
          path: ~/Purrfect-stealth-*-debug.apk
          retention-days: 7
          if-no-files-found: error
